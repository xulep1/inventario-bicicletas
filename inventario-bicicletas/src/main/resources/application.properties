spring.application.name=inventario-bicicletas
server.port=8080
# Acceso desde el celular conectado a la misma red.
server.address=0.0.0.0
spring.mvc.problemdetails.enabled=true
# Opcional para una red con varias interfaces o un dominio de despliegue.
# Si queda vacio, se calcula la direccion del servidor al generar cada QR.
app.base-url=http://10.106.65.5:8080

# Base de datos H2 para pruebas y exposicion en clase.
spring.datasource.url=jdbc:h2:file:./data/inventario-bicicletas
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
