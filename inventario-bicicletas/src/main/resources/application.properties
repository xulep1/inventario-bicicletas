spring.application.name=inventario-bicicletas
server.port=8080

# Permite el acceso desde un celular conectado a la misma red.
server.address=0.0.0.0
spring.mvc.problemdetails.enabled=true

# Dirección que se usará al generar los códigos QR.
app.base-url=http://10.106.65.5:8080

# Base de datos H2 en archivo para pruebas y exposición en clase.
spring.datasource.url=jdbc:h2:file:./data/inventario-bicicletas
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB